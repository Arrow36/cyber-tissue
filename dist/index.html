<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f1f4ef">
<meta name="description" content="向上滑动，抽出一张纸巾，看它轻轻飘落。纯前端、本地运行。">
<title>赛博抽纸</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23eef3ed'/%3E%3Crect x='5' y='15' width='22' height='12' rx='5' fill='%23b3cbbd'/%3E%3Cpath d='m12 18-1-11 6 2 5-3-2 12' fill='%23fffefa'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#62796d;--accent:#779786;--bg:#f1f4ef}
@supports (top: env(safe-area-inset-top)){:root{--device-safe-top:env(safe-area-inset-top);--device-safe-bottom:env(safe-area-inset-bottom);--device-safe-right:env(safe-area-inset-right)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);-webkit-touch-callout:none}
body{font-family:Inter,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#scene{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline-offset:-5px}
#scene.dragging{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus,canvas:focus{outline:2px solid var(--accent);outline-offset:5px}
.ui{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none}
.counter{position:absolute;left:50%;top:34px;top:calc(34px + var(--safe-area-inset-top, var(--device-safe-top, 0px)));transform:translateX(-50%);display:flex;align-items:center;height:51px;padding:0 18px;border:1px solid rgba(255,255,255,.7);border-radius:30px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:19px;line-height:1;font-weight:400;letter-spacing:.06em;font-variant-numeric:tabular-nums;min-width:83px;justify-content:center}
svg{display:block;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.counter svg{width:21px;height:21px;opacity:.7;margin-right:12px}
#count{transition:color .25s,transform .25s}#count.pop{color:#3b7557;transform:translateY(-2px)}
.gesture{position:absolute;left:50%;top:70%;transform:translateX(-50%);color:#8da396;transition:opacity .4s}
.gesture svg{width:28px;height:46px;stroke-width:1.2}.gesture.busy,.gesture.played{opacity:0}
.sound-toggle{position:absolute;top:34px;top:calc(34px + var(--safe-area-inset-top, var(--device-safe-top, 0px)));right:32px;right:calc(32px + var(--safe-area-inset-right, var(--device-safe-right, 0px)));width:51px;height:51px;border-radius:50%;border:1px solid rgba(255,255,255,.86);background:rgba(255,255,255,.82);display:grid;align-items:center;justify-items:center;pointer-events:auto;box-shadow:0 4px 16px rgba(83,109,93,.025)}
.sound-toggle:hover{background:rgba(255,255,255,.9)}.sound-toggle:active{transform:scale(.95)}
.sound-toggle svg{width:22px;height:22px}.sound-toggle .slash{display:none}.sound-toggle.off .waves{display:none}.sound-toggle.off .slash{display:block}
.actions{position:absolute;bottom:29px;bottom:calc(29px + var(--safe-area-inset-bottom, var(--device-safe-bottom, 0px)));right:32px;right:calc(32px + var(--safe-area-inset-right, var(--device-safe-right, 0px)));display:flex;align-items:center;pointer-events:auto}
.action{width:51px;height:51px;border-radius:50%;border:1px solid rgba(255,255,255,.86);background:rgba(255,255,255,.82);display:grid;align-items:center;justify-items:center;box-shadow:0 4px 16px rgba(83,109,93,.025);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:background .2s,transform .2s,opacity .2s}
.action:hover:not(:disabled){background:rgba(255,255,255,.85);transform:translateY(-2px)}.action:active:not(:disabled){transform:scale(.95)}.action:disabled{opacity:.35;cursor:default}
.action .check{display:none}.action.done .basket{display:none}.action.done .check{display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:600px){.sound-toggle{top:26px;top:calc(26px + var(--safe-area-inset-top, var(--device-safe-top, 0px)));right:24px;right:calc(24px + var(--safe-area-inset-right, var(--device-safe-right, 0px)))}.counter{top:26px;top:calc(26px + var(--safe-area-inset-top, var(--device-safe-top, 0px)));font-size:18px;padding:0 16px}.actions{bottom:25px;bottom:calc(25px + var(--safe-area-inset-bottom, var(--device-safe-bottom, 0px)));right:24px;right:calc(24px + var(--safe-area-inset-right, var(--device-safe-right, 0px)))}}
@media(max-height:500px){.counter{top:18px;height:44px}.sound-toggle{top:18px;width:44px;height:44px}.actions{bottom:18px}.gesture{display:none}.action{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="向上滑动抽出纸巾，松手后纸巾会四处飘落。也可按空格或向上键抽纸。"></canvas>
<main class="ui" aria-label="赛博抽纸">
<div class="counter" aria-label="已抽出纸巾数量"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 17 18.5H7A1.5 1.5 0 0 1 5.5 17V5A1.5 1.5 0 0 1 7 3.5Z"/><path d="M8.5 21h10a2.5 2.5 0 0 0 2.5-2.5v-11"/></svg><span id="count">0</span></div>
<div class="gesture" id="gesture" aria-hidden="true"><svg viewBox="0 0 28 46"><path d="M14 35V9m-6 6 6-6 6 6"/><path d="M10 41h8" opacity=".45"/></svg></div>
<button class="sound-toggle" id="sound-toggle" type="button" aria-label="关闭音效" aria-pressed="true" title="关闭音效"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="waves" d="M16 9a4 4 0 0 1 0 6m2.5-9a8 8 0 0 1 0 12"/><path class="slash" d="m16 9 5 6m0-6-5 6"/></svg></button>
<div class="actions">
<button class="action" id="clear" type="button" aria-label="清理散落的纸巾" title="清理散落的纸巾" disabled><svg class="basket" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="2.2"/><path d="m4.5 6 2 13c.2 1.3 2.4 2 5.5 2s5.3-.7 5.5-2l2-13M8.4 10l1 7.8M12 10.5v8M15.6 10l-1 7.8"/><path d="M7.2 13.5c2.8 1 6.8 1 9.6 0" opacity=".6"/></svg><svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
</div><div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
</main>
<noscript>请启用 JavaScript 来抽纸。</noscript>
<script src="./app.js"></script>
</body>
</html>
